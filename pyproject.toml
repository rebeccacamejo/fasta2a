[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fasta2a"
version = "0.1.0"
description = "FastA2A: Python framework for building and consuming Agent‑to‑Agent (A2A) servers."
readme = "fasta2a/README.md"
requires-python = ">=3.8"
authors = [
  { name = "FastA2A Contributors", email = "info@example.com" }
]
license = { text = "Apache-2.0" }
keywords = ["A2A", "agents", "fastapi", "LLM", "MCP"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "uvicorn>=0.34",
  "pydantic>=1.8",
]

[project.optional-dependencies]
llm = ["boto3>=1.29"]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "" }

[tool.setuptools.packages.find]
include = ["fasta2a*"]